<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Піт Мондріан — Композиція з червоним, синім і жовтим</title>
    <style type="text/css">
        table {
            border-collapse: collapse;
            width: 400px;
            height: 400px;
            border-style: hidden;
        }


        td {
            border: 5px solid #000;
        }
    </style>
</head>
<body>
    <table>
        <colgroup>
            <col style="width: 42px;">
            <col style="width: 54px;">
            <col style="width: 61px;">
            <col style="width: 107px;">
            <col style="width: 71px;">
            <col style="width: 65px;">
        </colgroup>
        <tr style="height: 37px;">
            <td colspan="2" style="background-color: #ffffff;"> </td>
            <td colspan="2" style="background-color: #ffffff;"> </td>
            <td colspan="2" style="background-color: #fffa69;"> </td>
        </tr>
        <tr style="height: 104px;">
            <td style="background-color: #ffffff;"> </td>
            <td colspan="3" rowspan="2" style="background-color: #ff5b2d;"> </td>
            <td colspan="2" style="background-color: #fffa69;"> </td>
        </tr>
        <tr style="height: 101px;">
            <td rowspan="2" style="background-color: #ffffff;"> </td>
            <td style="background-color: #ffffff;"> </td>
            <td style="background-color: #ffffff;"> </td>
        </tr>
        <tr style="height: 54px;">
            <td colspan="2" rowspan="2" style="background-color: #000000;"> </td>
            <td style="background-color: #ffffff;"> </td>
            <td colspan="2" style="background-color: #ffffff;"> </td>
        </tr>
        <tr style="height: 50px;">
            <td rowspan="3" style="background-color: #fffa69;"> </td>
            <td style="background-color: #ffffff;"> </td>
            <td colspan="2" rowspan="2" style="background-color: #074481;"> </td>
        </tr>
        <tr style="height: 25px;">
            <td colspan="2" rowspan="2" style="background-color: #ffffff;"> </td>
            <td style="background-color: #000000;"> </td>
        </tr>
        <tr style="height: 29px;">
            <td colspan="3" style="background-color: #ffffff;"> </td>
        </tr>
    </table>
</body>
</html>
